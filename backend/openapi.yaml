openapi: 3.0.3
info:
  title: Event registration API
  version: 0.1.0
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Starts a session. Wrong credentials are 400, not 401, so the frontend does not
        mistake them for an expired session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        The frontend asks who is signed in; the response also hands out the CSRF cookie
        that it sends back in X-CSRFToken on unsafe requests.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/events/:
    get:
      operationId: events_list
      description: Future events with their free seat count (full ones stay in the
        list), for everyone.
      tags:
      - events
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicEventList'
          description: ''
  /api/events/{event_id}/registrations/:
    post:
      operationId: events_registrations_create
      description: Registers a participant by email. Open to everyone and independent
        of the session.
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '404':
          description: No such event
  /api/events/{id}/:
    get:
      operationId: events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Liveness and database check for compose healthchecks, e2e and the
        frontend.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/org/events/:
    get:
      operationId: org_events_list
      description: The signed-in organizer's own events; creating one makes the caller
        its organizer.
      tags:
      - org
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          description: ''
    post:
      operationId: org_events_create
      description: The signed-in organizer's own events; creating one makes the caller
        its organizer.
      tags:
      - org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
  /api/org/events/{event_id}/checkin/:
    post:
      operationId: org_events_checkin_create
      description: The organizer checks a ticket in by the code the participant shows
        at the entrance.
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckInRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckInRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '403':
          description: Another organizer's event
        '404':
          description: No such event, or no such ticket at it
        '409':
          description: The ticket is waitlisted or cancelled
  /api/tickets/{manage_token}/:
    get:
      operationId: tickets_retrieve
      description: 'The ticket by the secret manage token from the email: status,
        code or waitlist place.'
      parameters:
      - in: path
        name: manage_token
        schema:
          type: string
        required: true
      tags:
      - tickets
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ''
        '404':
          description: Unknown token
  /api/tickets/{manage_token}/cancel/:
    post:
      operationId: tickets_cancel_create
      description: |-
        Cancels a registration by the secret manage token. Repeating it changes nothing.

        A checked-in ticket cannot be cancelled: its holder has already taken the seat.
      parameters:
      - in: path
        name: manage_token
        schema:
          type: string
        required: true
      tags:
      - tickets
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
          description: ''
        '404':
          description: Unknown token
        '409':
          description: The ticket is checked in at the entrance
components:
  schemas:
    CheckInRequestRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - code
    CheckInResult:
      type: object
      description: |-
        What the entrance screen shows: no full email, the queue can see the screen.

        A repeat is `already_checked_in` with the time of the first check-in.
      properties:
        result:
          $ref: '#/components/schemas/ResultEnum'
        name:
          type: string
        masked_email:
          type: string
        checked_in_at:
          type: string
          format: date-time
      required:
      - checked_in_at
      - masked_email
      - name
      - result
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        starts_at:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 10000
          minimum: 1
        confirmed:
          type: integer
          readOnly: true
          default: 0
        waitlisted:
          type: integer
          readOnly: true
          default: 0
      required:
      - capacity
      - confirmed
      - id
      - starts_at
      - title
      - waitlisted
    EventRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        starts_at:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 10000
          minimum: 1
      required:
      - capacity
      - starts_at
      - title
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStateEnum'
        database:
          $ref: '#/components/schemas/HealthStateEnum'
      required:
      - database
      - status
    HealthStateEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    PublicEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        capacity:
          type: integer
          readOnly: true
        free_seats:
          type: integer
          readOnly: true
      required:
      - capacity
      - description
      - free_seats
      - id
      - starts_at
      - title
    PublicEventList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        capacity:
          type: integer
          readOnly: true
        free_seats:
          type: integer
          readOnly: true
      required:
      - capacity
      - free_seats
      - id
      - starts_at
      - title
    RegisterRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - email
      - name
    RegistrationResult:
      type: object
      description: |-
        What the participant sees: no ticket code or manage token, they go out by email only.

        `position` is present only for a waitlisted registration.
      properties:
        status:
          $ref: '#/components/schemas/RegistrationStatusEnum'
        position:
          type: integer
          minimum: 1
      required:
      - status
    RegistrationStatusEnum:
      enum:
      - confirmed
      - waitlisted
      - cancelled
      type: string
      description: |-
        * `confirmed` - Confirmed
        * `waitlisted` - Waitlisted
        * `cancelled` - Cancelled
    ResultEnum:
      enum:
      - checked_in
      - already_checked_in
      type: string
      description: |-
        * `checked_in` - checked_in
        * `already_checked_in` - already_checked_in
    Ticket:
      type: object
      description: |-
        The ticket page behind the manage token from the email.

        `ticket_code` is present only for a confirmed registration, `position` only for a
        waitlisted one. `checked_in_at` is null until the ticket is checked in at the entrance.
      properties:
        status:
          $ref: '#/components/schemas/RegistrationStatusEnum'
        ticket_code:
          type: string
        position:
          type: integer
          minimum: 1
        name:
          type: string
        checked_in_at:
          type: string
          format: date-time
          nullable: true
        event:
          $ref: '#/components/schemas/TicketEvent'
      required:
      - checked_in_at
      - event
      - name
      - status
    TicketEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - starts_at
      - title
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
      - id
    ValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - errors
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
