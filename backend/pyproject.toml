[project]
name = "event-registration-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-stubs-ext>=6.1.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Apply exclude also to files passed explicitly (lint-staged, the agent hook).
force-exclude = true

[tool.ruff.lint]
# E/F/W: pycodestyle and pyflakes; I: import order; B: bugbear; UP: pyupgrade;
# DJ: Django; S: bandit (security); SIM: simplifications; RUF: ruff's own rules.
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
# Migrations are generated by Django: formatted, but not linted.
exclude = ["*/migrations/*"]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is how pytest checks things (S101); passwords are test data (S105, S106).
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
# Migrations are generated by Django and are not type-checked.
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "--strict-markers"
# Async tests (the SSE streams) without a marker on each. One loop for the session, like the one
# loop of a uvicorn process: the stats listener lives in it.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
