# Gateway for e2e: the built frontend and the backend on one origin, as behind a production
# proxy. Response buffering stays on (the default). Buffering alone does not hold the event
# stream back, buffering with gzip does: the backend's `X-Accel-Buffering: no` turns it off
# for the stream, so compression can be enabled here without breaking it.
server {
    listen 5173;
    root /usr/share/nginx/html;

    location / {
        # Client-side routes: an unknown path is the app.
        try_files $uri /index.html;
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        # The client's Host: Django checks it against ALLOWED_HOSTS and the CSRF Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
