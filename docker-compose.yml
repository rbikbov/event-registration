services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_registration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_registration"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: postgres
      # The frontend dev server proxies /api with the backend service name as Host.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # Links in emails are rendered by the backend, when the change is made.
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  worker:
    build: ./backend
    command: python manage.py run_worker
    # An unhandled error (database or SMTP down) ends the process; compose starts it again.
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      EMAIL_HOST: mailpit
      # Show the worker log in `docker compose logs` as it is written.
      PYTHONUNBUFFERED: "1"
    depends_on:
      # Healthy backend means migrations are applied.
      backend:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
