name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint needs the PR's base commit, not only the tip
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3 # no major tags since v8, only full versions
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      # Same commands as locally: everything except running e2e
      - run: make dev-deps
      - run: make check
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: make e2e
      - name: Service logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
